version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # Only the prefix is configurable; the "Bump X from 1 to 2" after it is not,
    # which is why conventional-commits.yml exempts Dependabot from the lower
    # case rule.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

    # assignees, not reviewers: GitHub dropped reviewers from the configuration
    # reference and points at CODEOWNERS, which this repo already has.
    assignees:
      - danganhphu

    labels:
      - dependencies

    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      analyzers:
        patterns:
          - Roslynator.*
      testing:
        patterns:
          - TUnit*
          - Moq
          - Bogus
      spectre:
        patterns:
          - Spectre.Console*

  # Actions are pinned to a commit SHA. Dependabot updates the SHA together with
  # the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    assignees:
      - danganhphu
    labels:
      - dependencies
      - ci
