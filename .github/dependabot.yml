version: 2

updates:
  # Central Package Management means every version lives in
  # Directory.Packages.props, so Dependabot edits one file.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # Dependabot's default title is "Bump X from 1 to 2", which the
    # conventional-commits workflow rejects. Setting the prefix here is the
    # native fix; a workflow that renames titles after the fact is not needed.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      analyzers:
        patterns:
          - Roslynator.*
      testing:
        patterns:
          - TUnit*
          - Moq
          - Bogus
      spectre:
        patterns:
          - Spectre.Console*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
