name: Feature request
description: Something the tool should be able to do and cannot.
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: >-
        Requests that amount to "download at a higher bitrate than SoundCloud
        stores" will be closed. Re-encoding 128 kbps upward costs bytes and adds
        no information, and this tool exists partly to stop people paying for
        sites that pretend otherwise.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where it stopped.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: If it is a new flag, write the command line you want to type.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing flags, another tool, doing it by hand.
