name: conventional-commits

# pull_request, not pull_request_target: this never checks the branch out and
# only reads the title, so it has no reason to run with a write-capable token.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    runs-on: ubuntu-latest

    steps:
      # A regex rather than a marketplace action: the rule is six lines of grep,
      # and an action here would be a supply chain dependency for six lines.
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}

          # The author, not github.actor: actor is whoever triggered the run, so
          # a human editing a Dependabot title would take the exemption away.
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._-]+\))?!?: .+"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected <type>(<optional scope>): <description>, where type is one of:"
            echo "  $types"
            exit 1
          fi

          # The subject is a description, not a sentence: no capital, no period.
          subject="${TITLE#*: }"

          # Dependabot writes its titles from a template that capitalises the
          # first word, and only the prefix is configurable. Exempting the whole
          # job instead would report as "skipped", which GitHub does not count
          # as success, so it would block these outright if this becomes
          # required. Every other rule below still applies to it.
          if [ "$AUTHOR" != 'dependabot[bot]' ] && printf '%s' "$subject" | grep -Eq '^[A-Z]'; then
            echo "::error::Start the description in lower case: $subject"
            exit 1
          fi

          if printf '%s' "$subject" | grep -Eq '\.$'; then
            echo "::error::Drop the trailing period: $subject"
            exit 1
          fi

          # ASCII punctuation only, the same rule the code is held to.
          if printf '%s' "$TITLE" | grep -Pq '[\x{2010}-\x{2015}\x{2018}-\x{201F}\x{2026}]'; then
            echo "::error::Use ASCII punctuation: no em dash, en dash, curly quotes or ellipsis character."
            exit 1
          fi

          echo "OK: $TITLE"
