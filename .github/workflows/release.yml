name: release

# Merging to main is the only trigger; merging the release pull request is what
# cuts a release. The three jobs share one workflow because a tag pushed by
# GITHUB_TOKEN does not start another run, so a tag-triggered workflow would
# never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled: a half finished release leaves a published release with no
# binaries on it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    name: publish ${{ matrix.runtime }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag release-please just created, so MinVer reads the released
          # version rather than whatever main has moved on to. It needs the
          # tags, and a shallow clone has none.
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # ILC links with clang on Linux. Without these the publish fails at the
      # link step rather than at compile.
      - name: Install the Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: pwsh
        run: ./build.ps1 Publish -Runtime ${{ matrix.runtime }}

      - name: Stage what goes in the archive
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path artifacts -Recurse -Include 'scdl', 'scdl.exe' | Select-Object -First 1

          if (-not $binary)
          {
              throw 'Publish produced no binary.'
          }

          $staging = Join-Path 'artifacts' 'release'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item $binary.FullName -Destination $staging
          Copy-Item 'README.md', 'LICENSE' -Destination $staging

      # Two steps because the format matters: zip carries no Unix permission
      # bits, so a Linux user unpacking one gets a binary without its executable
      # flag.
      - name: Archive for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          Compress-Archive `
              -Path 'artifacts/release/*' `
              -DestinationPath "artifacts/scdl-$version-${{ matrix.runtime }}.zip" `
              -Force

      - name: Archive for Unix
        if: runner.os != 'Windows'
        run: |
          version="${TAG#v}"
          tar -czf "artifacts/scdl-$version-${{ matrix.runtime }}.tar.gz" -C artifacts/release .
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scdl-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  attach:
    name: attach the binaries
    needs: [release-please, publish]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest

    # The only job that writes, kept separate so the build jobs stay read-only.
    permissions:
      contents: write # upload the assets
      id-token: write # sign the provenance
      attestations: write # record it

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum the archives
        working-directory: artifacts
        run: |
          sha256sum *.zip *.tar.gz | tee SHA256SUMS.txt

      # Not code signing, and it does not stop the SmartScreen warning. What it
      # gives is something a suspicious user can check:
      #
      #   gh attestation verify scdl-0.1.0-win-x64.zip --repo danganhphu/scdl-4life
      #
      # The archive is the subject, not the executable inside it - verifying an
      # extracted scdl.exe fails, because those bytes were never attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz

      # release-please already created the release and its notes, so this only
      # hangs the binaries on it. For the few minutes in between, the release
      # exists with no assets.
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            artifacts/*.zip \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS.txt \
            --clobber
