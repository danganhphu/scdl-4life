name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build the release from, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

          # MinVer reads the version off the nearest tag, and a shallow clone
          # has none. Without this the binary in the release would report
          # 0.0.0-alpha.0 no matter what tag triggered the build.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # ILC links with clang on Linux and needs the objects it links against.
      # Without these the publish fails at the link step, not at compile.
      - name: Install the Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # build.ps1 imports the MSVC environment itself on Windows and falls back
      # to a trimmed self-contained binary when no native toolchain is present,
      # which is why the upload globs both output folders.
      - name: Publish
        shell: pwsh
        run: ./build.ps1 Publish -Runtime ${{ matrix.runtime }}

      - name: Name the archive
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          $binary = Get-ChildItem -Path artifacts -Recurse -Include 'scdl', 'scdl.exe' | Select-Object -First 1

          if (-not $binary)
          {
              throw 'Publish produced no binary.'
          }

          $staging = Join-Path 'artifacts' 'release'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item $binary.FullName -Destination $staging
          Copy-Item 'README.md', 'LICENSE' -Destination $staging -ErrorAction SilentlyContinue

          $archive = Join-Path 'artifacts' "scdl-$version-${{ matrix.runtime }}.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive -Force

          "archive=$archive" >> $env:GITHUB_OUTPUT
        id: package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scdl-${{ matrix.runtime }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: draft the release
    needs: publish
    runs-on: ubuntu-latest

    # The only job that writes. Kept separate so the build jobs stay read-only.
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write # record it

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Written next to the archives so anyone can check that what they
      # downloaded is what this workflow built.
      - name: Checksum the archives
        working-directory: artifacts
        run: |
          sha256sum *.zip | tee SHA256SUMS.txt

      # Records in a public transparency log that these exact bytes came out of
      # this workflow, at this commit, on a GitHub runner. Free for a public
      # repository.
      #
      # This is not code signing and it does not stop the SmartScreen warning -
      # that needs a certificate somebody has to pay for every year. What it
      # does give is something a suspicious user can actually check:
      #
      #   gh attestation verify scdl-0.1.0-win-x64.zip --repo danganhphu/scdl-4life
      #
      # The archive is the subject, not the executable inside it. Verifying an
      # extracted scdl.exe fails, because those bytes were never attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.zip

      # Drafted rather than published: the release notes are worth reading
      # before anyone downloads a binary that claims to know what SoundCloud
      # actually serves.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
