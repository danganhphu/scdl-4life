name: ci

# No paths-ignore: these are required checks, and a run that a path filter skips
# reports as "skipped", which GitHub does not count as success. A readme-only
# pull request would never become mergeable.
on:
  push:
    branches: [main]

  # No branch filter either. With branches: [main] a pull request opened against
  # anything else was filtered out entirely and none of the required checks ever
  # ran, and retargeting it to main afterwards does not help - GitHub reports
  # that as `edited`, which pull_request does not listen for by default.
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Restore is the most expensive step on Windows, and most of it is the tool
      # manifest rather than the packages - it pulls a PowerShell of about 100 MB.
      # Local tools resolve out of the same global packages folder, so one cache
      # covers both restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '.config/dotnet-tools.json', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore scdl-4life.slnx

      - name: Build
        run: dotnet build scdl-4life.slnx -c Release --no-restore

      # MTP mode wants --solution; a bare positional path is a VSTest habit.
      - name: Test
        run: dotnet test --solution scdl-4life.slnx -c Release --no-build

  publish:
    name: publish win-x64
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Same key as the build job, so this reads what that one already wrote.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '.config/dotnet-tools.json', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # build.ps1 imports the MSVC environment itself, and falls back to a
      # trimmed self-contained binary when the toolchain is missing - which is
      # why the upload globs both output folders.
      - name: Publish
        shell: pwsh
        run: ./build.ps1 Publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scdl-win-x64
          path: artifacts/*/scdl.exe
          if-no-files-found: error
