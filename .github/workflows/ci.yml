name: ci

# Deliberately no paths-ignore. These jobs are required status checks, and a
# run that a path filter skips reports as "skipped", which GitHub does not
# count as success - a pull request touching only a readme would never become
# mergeable. The documented way around that is a second workflow emitting jobs
# of the same name that do nothing, and that is more moving parts than a three
# minute build is worth now that a public repo has unmetered Actions minutes.
on:
  push:
    branches: [main]

  # Fires on open and on every later commit, so a pull request is always checked
  # at its current head.
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore scdl-4life.slnx

      # Directory.Build.props turns on ContinuousIntegrationBuild when CI is set,
      # which GitHub does for every step. Analyzer findings are errors here, so a
      # warning-free build is the actual gate.
      - name: Build
        run: dotnet build scdl-4life.slnx -c Release --no-restore

      # MTP mode wants --solution; a bare positional path is a VSTest-mode habit.
      - name: Test
        run: dotnet test --solution scdl-4life.slnx -c Release --no-build

  publish:
    name: publish win-x64
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # build.ps1 imports the MSVC environment itself, so Native AOT links here.
      # It falls back to a trimmed self-contained binary if the toolchain is ever
      # missing, which is why the upload globs both output folders.
      - name: Publish
        shell: pwsh
        run: ./build.ps1 Publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scdl-win-x64
          path: artifacts/*/scdl.exe
          if-no-files-found: error
